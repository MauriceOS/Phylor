[package]
name = "phylor"
version = "0.2.0"
edition = "2021"
description = "Pre-execution guardrail for AI agent skills, rules, and MCP configs"
license = "MIT"
readme = "README.md"
keywords = ["security", "ai-agents", "cursor", "skills", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/MauriceOS/Phylor"
homepage = "https://github.com/MauriceOS/Phylor"

[[bin]]
name = "phylor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
notify = "7"
notify-rust = "=4.11.0"
pulldown-cmark = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = []
fanotify = []
